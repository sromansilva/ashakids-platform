name: Knowledge map
on:
  pull_request:
    paths: ['frontend/src/**', 'backend/app/**', 'frontend/tests/**', 'backend/tests/**', 'frontend/package.json', 'frontend/vite.config.ts', 'tools/knowledge/**', '.graphifyignore', '.gitignore', '.github/workflows/knowledge-map.yml']
  push:
    paths: ['frontend/src/**', 'backend/app/**', 'frontend/tests/**', 'backend/tests/**', 'frontend/package.json', 'frontend/vite.config.ts', 'tools/knowledge/**', '.graphifyignore', '.gitignore', '.github/workflows/knowledge-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  graph:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install tooling and generate local AST graph
        run: python tools/knowledge/manage.py setup
      - name: Verify freshness
        run: python tools/knowledge/manage.py check
      - uses: actions/upload-artifact@v4
        with:
          name: knowledge-map-${{ github.sha }}
          path: |
            graphify-out/graph.json
            graphify-out/GRAPH_REPORT.md
            graphify-out/graph.html
            graphify-out/sources.json
          if-no-files-found: error
          retention-days: 14
