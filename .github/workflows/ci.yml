name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: ["**"]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend checks
        working-directory: frontend
        run: npm run check:frontend
      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ashakids_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ashakids_test_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ashakids_test_ci
      ASHAKIDS_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ashakids_test_ci
      ASHAKIDS_TEST_ADMIN_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ashakids_test_ci
      ASHAKIDS_ALLOW_SHARED_DB_TESTS: '0'
      ASHAKIDS_ALLOW_ISOLATED_LIVE_TESTS: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Initialize disposable schema and test role
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:5432/ashakids_test_ci" --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE ashakids_runtime NOLOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT;"
          psql "postgresql://postgres:postgres@127.0.0.1:5432/ashakids_test_ci" --set ON_ERROR_STOP=1 \
            --file backend/scripts/db_creation.sql
      - name: Backend tests
        working-directory: backend
        run: python -m pytest -q

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag ashakids-ci .