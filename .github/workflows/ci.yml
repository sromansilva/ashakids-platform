name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: America/Lima
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: |
          npm ci
          ln -s ../frontend/node_modules ../tests/node_modules
      - name: Frontend tests
        working-directory: frontend
        run: npm run test
      - name: Type check
        working-directory: frontend
        run: npm run typecheck
      - name: Frontend architecture check
        working-directory: frontend
        run: npm run check:frontend
      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        working-directory: backend
        run: npm ci
      - name: Type check
        working-directory: backend
        run: npm run typecheck
      - name: Backend build
        working-directory: backend
        run: npm run build
      - name: Backend tests
        working-directory: backend
        run: npm run test

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build production image
        run: docker build --tag ashakids-ci .
