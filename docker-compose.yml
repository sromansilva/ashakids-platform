version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ashakids-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: ashakids
    ports:
      - "5432:5432"
    volumes:
      - ashakids-pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  ashakids-pgdata:

