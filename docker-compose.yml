services:
  postgres:
    image: postgres:18-alpine
    container_name: ashakids-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
      POSTGRES_DB: ${DB_NAME:-ashakids}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ashakids-pgdata-v18:/var/lib/postgresql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-ashakids}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ashakids-pgdata-v18:
